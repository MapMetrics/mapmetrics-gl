        <meta charset="UTF-8" />
        <link href="dist/mapmetrics-gl.css" rel="stylesheet" />

        <script>
            // Debug utility to monitor fetch and XHR requests
            function setupRequestDebugging() {
                // Monitor fetch calls
                const originalFetch = window.fetch;
                window.fetch = function(input, init) {
                    const url = typeof input === 'string' ? input : input.url;
                    const credentials = init ? init.credentials : 'not set';
                    
                    // Check if it's a tile request
                    if (url.includes('gateway.mapmetrics.org') && (url.includes('.mvt') || url.includes('.pbf'))) {
                        console.log('🌐 TILE REQUEST:', {
                            url,
                            credentials,
                            headers: init ? init.headers : 'none'
                        });
                        logDebug(`🌐 Tile fetch: ${url.substring(0, 40)}... (credentials: ${credentials})`);
                    } else if (url.includes('gateway.mapmetrics.org')) {
                        console.log('Gateway Request:', {
                            url,
                            credentials,
                            headers: init ? init.headers : 'none'
                        });
                        logDebug(`Gateway fetch: ${url.substring(0, 40)}... (credentials: ${credentials})`);
                    }
                    
                    return originalFetch.apply(this, arguments);
                };
                
                // Monitor XMLHttpRequest
                const originalXhrOpen = XMLHttpRequest.prototype.open;
                const originalXhrSetRequestHeader = XMLHttpRequest.prototype.setRequestHeader;
                const originalXhrSend = XMLHttpRequest.prototype.send;
                
                XMLHttpRequest.prototype.open = function() {
                    this._url = arguments[1];
                    this._method = arguments[0];
                    return originalXhrOpen.apply(this, arguments);
                };
                
                XMLHttpRequest.prototype.setRequestHeader = function(header, value) {
                    if (!this._headers) this._headers = {};
                    this._headers[header] = value;
                    return originalXhrSetRequestHeader.apply(this, arguments);
                };
                
                XMLHttpRequest.prototype.send = function() {
                    const url = this._url;
                    
                    // Check if it's a tile request
                    if (url.includes('gateway.mapmetrics.org') && (url.includes('.mvt') || url.includes('.pbf'))) {
                        console.log('🌐 TILE XHR REQUEST:', {
                            url,
                            withCredentials: this.withCredentials,
                            headers: this._headers || 'none',
                            method: this._method
                        });
                        logDebug(`🌐 Tile XHR: ${url.substring(0, 40)}... (withCredentials: ${this.withCredentials})`);
                    } else if (url.includes('gateway.mapmetrics.org')) {
                        console.log('Gateway XHR:', {
                            url, 
                            withCredentials: this.withCredentials,
                            headers: this._headers || 'none'
                        });
                        logDebug(`Gateway XHR: ${url.substring(0, 40)}... (withCredentials: ${this.withCredentials})`);
                    }
                    
                    return originalXhrSend.apply(this, arguments);
                };
            }

            // Debug function to log into the debug panel
            function logDebug(message, isError = false, isSuccess = false) {
                const debugEl = document.getElementById('debug');
                const timestamp = new Date().toISOString().substring(11, 19);
                let className = "";
                if (isError) className = "error";
                if (isSuccess) className = "success";
                
                debugEl.innerHTML += `[${timestamp}] <span class="${className}">${message}</span><br>`;
                debugEl.scrollTop = debugEl.scrollHeight;
            }
        </script>
