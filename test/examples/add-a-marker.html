<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            href="https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/mapmetrics-gl.css"
            rel="stylesheet"
        />
        <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
        <script src="https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/mapmetrics-gl.js"></script>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
            }
            #map {
                min-height: 500px;
                height: 100%;
                width: 100%;
            }
            .eiffel-marker {
                background-image: url("https://www.jawg.io/docs/images/icons/eiffel-tower@2x.png");
                background-size: cover;
                width: 50px;
                height: 50px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script>
            // Don't forget to replace <YOUR_ACCESS_TOKEN> by your own access token
            const accessToken = "<YOUR_ACCESS_TOKEN>";
            const protocol = new pmtiles.Protocol();
            mapmetrics.addProtocol("pmtiles", protocol.tile);
            const map = new mapmetrics.Map({
                container: "map",
                style: `https://gateway.mapmetrics-atlas.net/styles/?fileName=<YOUR_ACCOUNT_ID>/<YOUR_STYLE>.json&token=${accessToken}`,
                zoom: 11,
                center: [2.349902, 48.852966],
            }).addControl(new mapmetrics.NavigationControl(), "top-right");
            // This plugin is used for right to left languages
            mapmetrics.setRTLTextPlugin(
                "https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.js"
            );

            // Add a marker with the default icon
            new mapmetrics.Marker().setLngLat([2.349902, 48.852966]).addTo(map);

            // Add a Marker with a custom icon.

            const el = document.createElement("div");
            el.addEventListener("click", () => {
                window.alert("Eiffel Tower");
            });

            // add marker to map
            new mapmetrics.Marker({
                className: "eiffel-marker",
                element: el,
            })
                .setLngLat([2.294694, 48.858093])
                .addTo(map);
        </script>
    </body>
</html>
