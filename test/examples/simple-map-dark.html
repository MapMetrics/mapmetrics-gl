<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link
            href="https://gateway.mapmetrics.org/assets/css/mapmetrics-gl.css"
            rel="stylesheet"
        />
        <script src="https://gateway.mapmetrics.org/assets/js/mapmetrics-gl.js"></script>
        <script src="https://gateway.mapmetrics.org/assets/js/pmtiles.js"></script>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
            }
            #map {
                min-height: 500px;
                height: 100%;
                width: 100%;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script>
            // Don't forget to replace <YOUR_ACCESS_TOKEN> by your own access token
            const accessToken = "<YOUR_ACCESS_TOKEN>";
            const protocol = new pmtiles.Protocol();
            mapmetrics.addProtocol("pmtiles", protocol.tile);

            const map = new mapmetrics.Map({
                container: "map",
                style: `https://gateway.mapmetrics.org/styles/dark.json?token=${accessToken}`,
                zoom: 11,
                center: [2.349902, 48.852966],
            }).addControl(new mapmetrics.NavigationControl(), "top-right");
            // This plugin is used for right to left languages
            mapmetrics.setRTLTextPlugin(
                "https://gateway.mapmetrics.org/assets/js/mapmetrics-gl-rtl-text.min.js"
            );
        </script>
    </body>
</html>
