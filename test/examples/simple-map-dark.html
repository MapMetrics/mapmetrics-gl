<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link
            href="../../dist/mapmetrics-gl.css"
            rel="stylesheet"
        />
        <script src="../../dist/mapmetrics-gl-dev.js"></script>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
            }
            #map {
                min-height: 500px;
                height: 100%;
                width: 100%;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script>
            const map = new mapmetricsgl.Map({
                container: "map",
                style: 'https://gateway.mapmetrics-atlas.net/styles/?fileName=<YOUR_ACCOUNT_ID>/<YOUR_STYLE>.json&token=<YOUR_TOKEN>',
                zoom: 11,
                center: [2.349902, 48.852966],
                attributionControl: false  // Hides the attribution control
            }).addControl(new mapmetricsgl.NavigationControl(), "top-right");
        </script>
    </body>
</html>
