<!DOCTYPE html>
<html lang="en">
    <head>
        <meta
            property="og:description"
            content="Display a globe with a vector map."
        />
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/mapmetrics-gl.css"
        />
        <script src="https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/mapmetrics-gl.js"></script>
        <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>

        <style>
            body {
                margin: 0;
                padding: 0;
            }
            html,
            body,
            #map {
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <script>

            const map = new mapmetricsgl.Map({
                container: "map",
                // Keyless demo style -- renders without an account, watermarked.
                // Serve this page over http://localhost; the demo endpoint allowlists
                // origins and answers 403 to file:// (Origin: null).
                // With your own key, swap in:
                //   `https://gateway.mapmetrics-atlas.net/styles/?fileName=${accountId}/${style}.json&token=${accessToken}`
                style: "https://gateway.mapmetrics-atlas.net/demo/style.json",
                zoom: 0,
                center: [137.9150899566626, 36.25956997955441],
            });

            map.on("style.load", () => {
                map.setProjection({
                    type: "globe", // Set projection to globe
                });
            });
        </script>
    </body>
</html>
