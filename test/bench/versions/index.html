<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Mapmetrics GL JS Benchmarks</title>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="about:blank" />
    </head>

    <body>
        <div id="benchmarks"></div>
        <script src="/test/bench/benchmarks_view_generated.js"></script>
        <script>
            runComparison();

            async function runComparison() {
                try {
                    const params = new URL(location).searchParams;
                    window.versionsDisplayName = params
                        .getAll("compare")
                        .filter(Boolean);
                    if (!params.has("compare")) {
                        const response = await fetch(
                            "https://api.github.com/repos/maplibre/maplibre-gl-js/releases/latest"
                        );
                        const responseJson = await response.json();
                        window.versionsDisplayName = [
                            responseJson["tag_name"],
                            "main",
                        ];
                    }
                    console.log(
                        `Comparing versions: ${window.versionsDisplayName}`
                    );
                    const versionsScripts = window.versionsDisplayName
                        .map(
                            (v) =>
                                `https://maplibre.org/maplibre-gl-js/benchmarks/${v}/benchmarks_generated.js`
                        )
                        .concat("/test/bench/versions/benchmarks_generated.js");
                    for (const script of versionsScripts) {
                        await loadScript(script);
                    }
                    const benchmarks = [];
                    const benchmarkNameList = Object.keys(
                        window.mapmetricsglBenchmarks
                    ).sort();
                    for (const benchmarkName of benchmarkNameList) {
                        const versions = [];

                        // also handle benchmarks from mapboxgl releases
                        if (
                            window.mapboxglBenchmarks &&
                            window.mapboxglBenchmarks[benchmarkName]
                        ) {
                            Object.assign(
                                window.mapmetricsglBenchmarks[benchmarkName],
                                window.mapboxglBenchmarks[benchmarkName]
                            );
                        }

                        let index = 0;
                        for (const version in window.mapmetricsglBenchmarks[
                            benchmarkName
                        ]) {
                            if (!window.versionsDisplayName[index]) {
                                window.versionsDisplayName[index] = version;
                            }
                            versions.push({
                                displayName: window.versionsDisplayName[index],
                                name: version,
                                bench: window.mapmetricsglBenchmarks[
                                    benchmarkName
                                ][version],
                            });
                            index++;
                        }
                        benchmarks.push({ name: benchmarkName, versions });
                    }

                    const results = await window.Benchmarks.run(benchmarks);

                    window.mapmetricsglBenchmarkResults = {};
                    for (const result of results) {
                        window.mapmetricsglBenchmarkResults[result.name] = {};
                        for (const version of result.versions) {
                            window.mapmetricsglBenchmarkResults[result.name][
                                version.name
                            ] = {
                                name: version.name,
                                summary: version.summary,
                                regression: version.regression,
                            };
                        }
                    }

                    window.mapmetricsglBenchmarkFinished = true;
                } catch (ex) {
                    console.error(ex);
                }
            }

            function loadScript(src) {
                return new Promise((resolve, reject) => {
                    const s = document.createElement("script");
                    s.src = src;
                    s.onload = resolve;
                    s.onerror = reject;
                    document.head.appendChild(s);
                });
            }
        </script>
    </body>
</html>
