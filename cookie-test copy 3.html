<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>MapMetrics Map</title>
    <link href="https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/versions/latest/mapmetrics-gl.css" rel="stylesheet"/>
  <script src="https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/versions/latest/mapmetrics-gl.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: Arial, sans-serif;
            /* Space/galaxy background */
            background: linear-gradient(to bottom, #000428 0%, #004e92 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated stars */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 40px 70px, white, transparent),
                radial-gradient(1px 1px at 50px 50px, white, transparent),
                radial-gradient(1px 1px at 80px 10px, white, transparent),
                radial-gradient(2px 2px at 130px 80px, white, transparent),
                radial-gradient(1px 1px at 110px 120px, white, transparent);
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: stars 200s linear infinite;
            opacity: 0.8;
            z-index: -1;
        }
        
        /* Second layer of stars for depth */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 25px 25px, white, transparent),
                radial-gradient(1px 1px at 75px 75px, white, transparent),
                radial-gradient(1px 1px at 125px 25px, white, transparent),
                radial-gradient(1px 1px at 175px 175px, white, transparent);
            background-repeat: repeat;
            background-size: 250px 250px;
            animation: stars 400s linear infinite;
            opacity: 0.5;
            z-index: -1;
        }
        
        @keyframes stars {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-200px);
            }
        }
        
        #map {
            min-height: 500px;
            height: 700px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 80px rgba(100, 150, 255, 0.3);
            position: relative;
            z-index: 1;
        }
        
        .marker {
            background-image: url("https://www.jawg.io/docs/images/icons/eiffel-tower@2x.png");
            background-size: cover;
            width: 50px;
            height: 50px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script>
        // Wait for the script to load
        window.onload = () => {
            
            const map = new mapmetricsgl.Map({
                container: "map",
                style:'https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/Images/PickSpot.json',//'https://api.protomaps.com/styles/v5/light/en.json?key=23a06ed261082457', // // be aware this token is not for production use
                center: [36.8219, -1.2921], // Center of Kenya (Nairobi) - MapMetrics GL uses [lng, lat]
                zoom: 7,
                fadeDuration: 0,
                cancelPendingTileRequestsWhileZooming: false,
                maxTileCacheZoomLevels: 10 ,
                crossSourceCollisions: false,
                renderWorldCopies: false,
    
                // attributionControl: {
                //     compact: false,
                //     position: 'bottom-right'
                // }
            }).addControl(new mapmetricsgl.NavigationControl(), "top-right");
            map.on('load', () => {
            map.addSource('route', {
            'type': 'geojson',
            'data': {
                'type': 'Feature',
                'properties': {},
                'geometry': {
                    'type': 'LineString',
                    'coordinates': [
                        [-122.48369693756104, 37.83381888486939],
                        [-122.48348236083984, 37.83317489144141],
                        [-122.48339653015138, 37.83270036637107],
                        [-122.48356819152832, 37.832056363179625],
                        [-122.48404026031496, 37.83114119107971],
                        [-122.48404026031496, 37.83049717427869],
                        [-122.48348236083984, 37.829920943955045],
                        [-122.48356819152832, 37.82954808664175],
                        [-122.48507022857666, 37.82944639795659],
                        [-122.48610019683838, 37.82880236636284],
                        [-122.48695850372314, 37.82931081282506],
                        [-122.48700141906738, 37.83080223556934],
                        [-122.48751640319824, 37.83168351665737],
                        [-122.48803138732912, 37.832158048267786],
                        [-122.48888969421387, 37.83297152392784],
                        [-122.48987674713133, 37.83263257682617],
                        [-122.49043464660643, 37.832937629287755],
                        [-122.49125003814696, 37.832429207817725],
                        [-122.49163627624512, 37.832564787218985],
                        [-122.49223709106445, 37.83337825839438],
                        [-122.49378204345702, 37.83368330777276]
                    ]
                }
            }
        });
        map.setProjection({
          type: "globe", // Set projection to globe
        });
        map.addLayer({
            'id': 'route',
            'type': 'line',
            'source': 'route',
            'layout': {
                'line-join': 'round',
                'line-cap': 'round'
            },
            'paint': {
                'line-color':'Black',
                'line-width': 12
            }
        });
    });
            // map.addControl(new mapmetricsgl.LogoControl({compact: false, position: 'bottom-left'}));
            // Add car marker
            const carmarker = new mapmetricsgl.Marker({
                icon: "https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/Images/car.png"
            })
                .setLngLat([2.349902, 48.852966])
                .addTo(map);

            // Add draggable marker
            const marker = new mapmetricsgl.Marker({
                color: "#FF0000",
                draggable: true
            })
                .setLngLat([2.349902, 48.841066])
                .addTo(map);

            // Add event listeners for map loading and errors
            map.on('load', () => console.log('Map loaded'));
            map.on('error', (e) => console.error(`Map error: ${e.error?.message || 'Unknown error'}`));
        };
    </script>
</body>
</html>
