<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>MapMetrics Cookie Prefetch Test</title>
    <link href="dist/mapmetrics-gl.css" rel="stylesheet" />
    <script src="dist/mapmetrics-gl.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        #log {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        #map {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        button {
            margin: 5px;
            padding: 10px;
            font-size: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        h1 {
            color: #333;
        }
        .controls {
            margin-bottom: 20px;
        }
        #tileStatus {
            margin-top: 20px;
            padding: 10px;
            background-color: #e8f5e9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>MapMetrics Cookie Prefetch Test</h1>
        
        <div class="controls">
            <button id="btnFetch">Manually Fetch Cookie</button>
            <button id="btnClear">Clear Log</button>
            <button id="btnLoadMap">Load Map</button>
        </div>
        
        <div id="log"></div>
        
        <div id="tileStatus">
            <strong>Tile Request Status:</strong> <span id="statusText">No requests made yet</span>
        </div>
        
        <div id="map"></div>
    </div>
    
    <script>
        // Debug setup
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('statusText');
        
        // Sample tile URL for testing and prefetching
        const SAMPLE_TILE_URL = 'http://localhost:8787/20250110/1/1/0.mvt?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI5MWNmNTBmNS1lM2NiLTQ1ZDMtYTFhYi1mMmY1NzVmNmM5YjIiLCJzY29wZSI6WyJtYXBzIiwiYXV0b2NvbXBsZXRlIiwiZ2VvY29kZSJdLCJpYXQiOjE3NDcxNDE5OTB9.mAtqzwAPCcQhyEr45AgPaCFor4hePZu7tpoUrJUGwGs';
        
        function log(message, isError = false, isSuccess = false) {
            const timestamp = new Date().toISOString().substr(11, 8);
            let className = '';
            if (isError) className = 'error';
            if (isSuccess) className = 'success';
            
            logEl.innerHTML += `[${timestamp}] <span class="${className}">${message}</span>\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        // Override console logging to capture cookie prefetch logs
        const origConsoleLog = console.log;
        const origConsoleWarn = console.warn;
        const origConsoleError = console.error;
        
        console.log = function() {
            const message = arguments[0];
            if (typeof message === 'string' && message.includes('🍪')) {
                log(message, false, true);
            }
            return origConsoleLog.apply(this, arguments);
        };
        
        console.warn = function() {
            const message = arguments[0];
            if (typeof message === 'string' && message.includes('🍪')) {
                log(message, true, false);
            }
            return origConsoleWarn.apply(this, arguments);
        };
        
        console.error = function() {
            const message = arguments[0];
            if (typeof message === 'string') {
                log(message, true, false);
            }
            return origConsoleError.apply(this, arguments);
        };
        
        // Monitor network requests
        let tileRequests = 0;
        let tileRequestsWithCredentials = 0;
        
        // Monkey patch fetch to track credentials
        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
            const url = typeof input === 'string' ? input : input.url;
            const credentials = init ? init.credentials : 'not set';
            
            // Track tile requests
            if (url.includes('gateway.mapmetrics.org') && (url.includes('.mvt') || url.includes('.pbf'))) {
                tileRequests++;
                if (credentials === 'include') {
                    tileRequestsWithCredentials++;
                }
                
                log(`Tile Request ${tileRequests}: ${url.substring(0, 50)}...`);
                log(`  credentials: ${credentials}`, credentials !== 'include', credentials === 'include');
                
                updateStatus();
            }
            // Log prefetch requests
            else if (url.includes('gateway.mapmetrics.org')) {
                log(`Request to: ${url.substring(0, 50)}...`);
                log(`  method: ${init?.method || 'GET'}, credentials: ${credentials}`, credentials !== 'include', credentials === 'include');
            }
            
            return originalFetch.apply(this, arguments);
        };
        
        // Monitor XMLHttpRequest
        const originalXhrOpen = XMLHttpRequest.prototype.open;
        const originalXhrSend = XMLHttpRequest.prototype.send;
        
        XMLHttpRequest.prototype.open = function() {
            this._url = arguments[1];
            return originalXhrOpen.apply(this, arguments);
        };
        
        XMLHttpRequest.prototype.send = function() {
            const url = this._url;
            
            if (url.includes('gateway.mapmetrics.org') && (url.includes('.mvt') || url.includes('.pbf'))) {
                tileRequests++;
                if (this.withCredentials) {
                    tileRequestsWithCredentials++;
                }
                
                log(`Tile XHR ${tileRequests}: ${url.substring(0, 50)}...`);
                log(`  withCredentials: ${this.withCredentials}`, !this.withCredentials, this.withCredentials);
                
                updateStatus();
            }
            
            return originalXhrSend.apply(this, arguments);
        };
        
        function updateStatus() {
            statusEl.textContent = `${tileRequestsWithCredentials}/${tileRequests} requests with credentials`;
            if (tileRequests > 0 && tileRequestsWithCredentials === tileRequests) {
                statusEl.className = 'success';
            } else if (tileRequests > 0) {
                statusEl.className = 'error';
            }
        }
        
        // MapMetrics style
        const mapStyle = {
            "version": 8,
            "name": "Cookie Test Style",
            "sources": {
                "mapmetrics-tiles": {
                    "type": "vector",
                    "tiles": [
                        "https://kong-server-ne.ashycoast-684290aa.northeurope.azurecontainerapps.io/20250110/{z}/{x}/{y}.mvt?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI5MWNmNTBmNS1lM2NiLTQ1ZDMtYTFhYi1mMmY1NzVmNmM5YjIiLCJzY29wZSI6WyJtYXBzIiwiYXV0b2NvbXBsZXRlIiwiZ2VvY29kZSJdLCJpYXQiOjE3NDcxNDE5OTB9.mAtqzwAPCcQhyEr45AgPaCFor4hePZu7tpoUrJUGwGs"
                    ],
                    "maxzoom": 15
                }
            },
            "layers": [
                {
                    "id": "background",
                    "type": "background",
                    "paint": {
                        "background-color": "#f0f0f0"
                    }
                },
                {
                    "id": "roads",
                    "type": "line",
                    "source": "mapmetrics-tiles",
                    "source-layer": "roads",
                    "paint": {
                        "line-color": "#3887be",
                        "line-width": 1
                    }
                }
            ]
        };
        
        // Manual cookie fetch test
        document.getElementById('btnFetch').addEventListener('click', async function() {
            log('Making manual fetch request to a MapMetrics tile URL...', false, false);
            
            try {
                log('Attempting direct tile request to gateway...', false, false);
                const tileResponse = await fetch(SAMPLE_TILE_URL, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/x-protobuf',
                        'Origin': 'https://localhost:8000'
                    }
                });
                
                if (!tileResponse.ok) {
                    if (tileResponse.status === 401) {
                        throw new Error('Authentication failed. The token may be invalid or expired.');
                    }
                    throw new Error(`HTTP error! status: ${tileResponse.status}`);
                }
                
                console.log('=== Response Details ===');
                console.log('Status:', tileResponse.status);
                console.log('Status Text:', tileResponse.statusText);
                console.log('Type:', tileResponse.type);
                console.log('URL:', tileResponse.url);
                
                console.log('\n=== Response Headers ===');
                tileResponse.headers.forEach((value, key) => {
                    console.log(`${key}: ${value}`);
                });
                
                console.log('\n=== Cookie Details ===');
                console.log('Document Cookie:', document.cookie);
                console.log('Set-Cookie Header:', tileResponse.headers.get('set-cookie'));
                
                log(`Tile request successful! Status: ${tileResponse.status}`, false, true);
                log(`Response headers: ${Array.from(tileResponse.headers.entries()).map(e => e[0] + ': ' + e[1]).join(', ')}`, false, true);
                
                // Log cookies from response
                const cookies = document.cookie;
                log(`Current cookies: ${cookies}`, false, true);
                
                const blob = await tileResponse.blob();
                log(`Received data size: ${blob.size} bytes`, false, true);
                
            } catch (error) {
                log(`Manual tile fetch failed: ${error.message}`, true, false);
                
                // More detailed error logging
                if (error.name === 'TypeError' && error.message === 'Failed to fetch') {
                    log('Network error: This could be due to:', true, false);
                    log('1. Server connection issues', true, false);
                    log('2. Invalid or expired token', true, false);
                    log('3. Network connectivity issues', true, false);
                } else if (error.message.includes('Authentication failed')) {
                    log('Authentication error: The token appears to be invalid or expired', true, false);
                    log('Please check if you need to generate a new token', true, false);
                }
                
                // Log the full error details
                console.error('Full error details:', {
                    name: error.name,
                    message: error.message,
                    stack: error.stack,
                    cause: error.cause
                });
            }
        });
        
        // Clear log
        document.getElementById('btnClear').addEventListener('click', function() {
            logEl.innerHTML = '';
            tileRequests = 0;
            tileRequestsWithCredentials = 0;
            updateStatus();
        });
        
        // Load map
        let map = null;
        document.getElementById('btnLoadMap').addEventListener('click', async function() {
            if (map) {
                log('Map already loaded. Refresh page to test again.', false, false);
                return;
            }
            
            log('Creating map with vector tile source...', false, false);
            
            try {
                // First fetch the style JSON
                const styleUrl = "https://gateway.mapmetrics.org/styles/?fileName=34f5df91-bf05-4557-aa40-96a03ce131f5/jimstyle2.json&token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiIzNGY1ZGY5MS1iZjA1LTQ1NTctYWE0MC05NmEwM2NlMTMxZjUiLCJzY29wZSI6WyJtYXBzIiwiYXV0b2NvbXBsZXRlIiwiZ2VvY29kaW5nIl0sImlhdCI6MTc0NDk2ODI0NX0.9PAc6wS6-GsGZMsI6fq5eTRCszhPM8kkQufRq_KOdbQ";
                log('Fetching style JSON...', false, false);
                
                const styleResponse = await fetch(styleUrl, {
                    method: 'GET',
                    credentials: 'omit',  // Don't send credentials for style fetch
                    headers: {
                        'Accept': 'application/json',
                        'Origin': 'https://localhost:8000'
                    }
                });
                
                if (!styleResponse.ok) {
                    throw new Error(`Failed to fetch style: ${styleResponse.status} ${styleResponse.statusText}`);
                }
                
                const styleJson = await styleResponse.json();
                log('Style JSON fetched successfully', false, true);
                
                map = new mapmetricsgl.Map({
                    container: 'map',
                    style: styleJson,
                    center: [4.9041, 52.3676],
                    zoom: 12,
                    mapmetricsLogo: true,
                    logoPosition: 'bottom-left'
                });
                
                // Set up event handlers before loading the style
                map.on('style.load', () => {
                    log('Map style loaded successfully', false, true);
                    // Check cookies after map loads
                    const cookies = document.cookie;
                    log(`Cookies after map load: ${cookies}`, false, true);
                });
                
                map.on('error', (e) => {
                    log(`Map error: ${e.error?.message || 'Unknown error'}`, true, false);
                    // Log more details about the error
                    if (e.error) {
                        log(`Error details: ${JSON.stringify(e.error)}`, true, false);
                    }
                });
                
                map.on('data', (e) => {
                    if (e.dataType === 'source' && e.isSourceLoaded) {
                        log(`Source loaded: ${e.sourceId}`, false, true);
                    }
                });

                // Add specific handlers for tile loading
                map.on('sourcedata', (e) => {
                    if (e.isSourceLoaded) {
                        log(`Source data loaded: ${e.sourceId}`, false, true);
                    }
                });

                map.on('sourcedataloading', (e) => {
                    log(`Source data loading: ${e.sourceId}`, false, false);
                });

                map.on('sourcedataerror', (e) => {
                    log(`Source data error: ${e.sourceId} - ${e.error?.message || 'Unknown error'}`, true, false);
                });
            } catch (e) {
                log(`Error creating map: ${e.message}`, true, false);
            }
        });
        
        // Initial log
        log('🍪 Cookie Prefetch Test - Updated', false, true);
        log('1. Cookie prefetch now uses a real tile URL instead of domain root');
        log('2. Click "Manually Fetch Cookie" to test the direct tile fetch');
        log('3. Click "Load Map" to initialize the map with cookie prefetch');
        log('4. All tile requests should include credentials after prefetch');
    </script>
</body>
</html>
