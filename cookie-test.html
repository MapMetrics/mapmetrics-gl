<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>MapMetrics Cookie Test</title>
    <link href="dist/mapmetrics-gl.css" rel="stylesheet" />
    <script src="dist/mapmetrics-gl.js"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 400px; border: 1px solid #ccc; }
        #log { background: #f0f0f0; padding: 10px; margin: 10px 0; font-family: monospace; }
        button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <div id="container">
        <button id="btnFetch">Fetch Cookie</button>
        <button id="btnLoadMap">Load Map</button>
        <div id="log"></div>
        <div id="map"></div>
    </div>
    
    <script>
        const logEl = document.getElementById('log');
        
        function log(message) {
            const timestamp = new Date().toISOString().substr(11, 8);
            logEl.innerHTML += `[${timestamp}] ${message}\n`;
            console.log(message);
        }
        
        // Sample tile URL
        const SAMPLE_TILE_URL = 'https://gateway.mapmetrics.org/20250110/1/1/0.mvt?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI5MWNmNTBmNS1lM2NiLTQ1ZDMtYTFhYi1mMmY1NzVmNmM5YjIiLCJzY29wZSI6WyJtYXBzIiwiYXV0b2NvbXBsZXRlIiwiZ2VvY29kZSJdLCJpYXQiOjE3NDcxNDE5OTB9.mAtqzwAPCcQhyEr45AgPaCFor4hePZu7tpoUrJUGwGs';
        
        // Map style
        const mapStyle = {
            "version": 8,
            "sources": {
                "mapmetrics-tiles": {
                    "type": "vector",
                    "tiles": [
                        "https://gateway.mapmetrics.org/20250110/{z}/{x}/{y}.mvt?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI5MWNmNTBmNS1lM2NiLTQ1ZDMtYTFhYi1mMmY1NzVmNmM5YjIiLCJzY29wZSI6WyJtYXBzIiwiYXV0b2NvbXBsZXRlIiwiZ2VvY29kZSJdLCJpYXQiOjE3NDcxNDE5OTB9.mAtqzwAPCcQhyEr45AgPaCFor4hePZu7tpoUrJUGwGs"
                    ],
                    "maxzoom": 15
                }
            },
            "layers": [
                {
                    "id": "background",
                    "type": "background",
                    "paint": { "background-color": "#f0f0f0" }
                },
                {
                    "id": "roads",
                    "type": "line",
                    "source": "mapmetrics-tiles",
                    "source-layer": "roads",
                    "paint": {
                        "line-color": "#3887be",
                        "line-width": 1
                    }
                }
            ]
        };
        
        // Fetch cookie
        document.getElementById('btnFetch').addEventListener('click', async function() {
            try {
                log('Making tile request...');
                const response = await fetch(SAMPLE_TILE_URL, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/x-protobuf'
                    }
                });
                
                log(`Status: ${response.status}`);
                log(`Headers: ${Array.from(response.headers.entries()).map(e => e[0] + ': ' + e[1]).join(', ')}`);
                log(`Cookies: ${document.cookie}`);
                
                const blob = await response.blob();
                log(`Received ${blob.size} bytes`);
                
            } catch (error) {
                log(`Error: ${error.message}`);
            }
        });
        
        // Load map
        let map = null;
        document.getElementById('btnLoadMap').addEventListener('click', function() {
            if (map) {
                log('Map already loaded');
                return;
            }
            
            try {
                map = new mapmetricsgl.Map({
                    container: 'map',
                    style: mapStyle,
                    center: [2.3210938, 48.7965913],
                    zoom: 2
                });
                
                map.on('load', () => log('Map loaded'));
                map.on('error', (e) => log(`Map error: ${e.error?.message || 'Unknown error'}`));
                
            } catch (e) {
                log(`Error creating map: ${e.message}`);
            }
        });
        
        log('Ready to test');
    </script>
</body>
</html>
