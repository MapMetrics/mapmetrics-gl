<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link
            href="dist/mapmetrics-gl.css"
            rel="stylesheet"
        />
        <script src="dist/mapmetrics-gl.js"></script>
        <script>
            // Simple PMTiles protocol implementation to avoid dependency
            const pmtiles = {
                Protocol: function() {
                    return {
                        tile: function(params, callback) {
                            callback(null, null);
                        }
                    };
                }
            };

            // Debug utility to monitor fetch and XHR requests
            function setupRequestDebugging() {
                // Monitor fetch calls
                const originalFetch = window.fetch;
                window.fetch = function(input, init) {
                    const url = typeof input === 'string' ? input : input.url;
                    const credentials = init ? init.credentials : 'not set';
                    
                    // Check if it's a tile request
                    if (url.includes('gateway.mapmetrics.org') && (url.includes('.mvt') || url.includes('.pbf'))) {
                        console.log('🌐 TILE REQUEST:', {
                            url,
                            credentials,
                            headers: init ? init.headers : 'none'
                        });
                        logDebug(`🌐 Tile fetch: ${url.substring(0, 40)}... (credentials: ${credentials})`);
                    } else if (url.includes('gateway.mapmetrics.org')) {
                        console.log('Gateway Request:', {
                            url,
                            credentials,
                            headers: init ? init.headers : 'none'
                        });
                        logDebug(`Gateway fetch: ${url.substring(0, 40)}... (credentials: ${credentials})`);
                    }
                    
                    return originalFetch.apply(this, arguments);
                };
                
                // Monitor XMLHttpRequest
                const originalXhrOpen = XMLHttpRequest.prototype.open;
                const originalXhrSetRequestHeader = XMLHttpRequest.prototype.setRequestHeader;
                const originalXhrSend = XMLHttpRequest.prototype.send;
                
                XMLHttpRequest.prototype.open = function() {
                    this._url = arguments[1];
                    this._method = arguments[0];
                    return originalXhrOpen.apply(this, arguments);
                };
                
                XMLHttpRequest.prototype.setRequestHeader = function(header, value) {
                    if (!this._headers) this._headers = {};
                    this._headers[header] = value;
                    return originalXhrSetRequestHeader.apply(this, arguments);
                };
                
                XMLHttpRequest.prototype.send = function() {
                    const url = this._url;
                    
                    // Check if it's a tile request
                    if (url.includes('gateway.mapmetrics.org') && (url.includes('.mvt') || url.includes('.pbf'))) {
                        console.log('🌐 TILE XHR REQUEST:', {
                            url,
                            withCredentials: this.withCredentials,
                            headers: this._headers || 'none',
                            method: this._method
                        });
                        logDebug(`🌐 Tile XHR: ${url.substring(0, 40)}... (withCredentials: ${this.withCredentials})`);
                    } else if (url.includes('gateway.mapmetrics.org')) {
                        console.log('Gateway XHR:', {
                            url, 
                            withCredentials: this.withCredentials,
                            headers: this._headers || 'none'
                        });
                        logDebug(`Gateway XHR: ${url.substring(0, 40)}... (withCredentials: ${this.withCredentials})`);
                    }
                    
                    return originalXhrSend.apply(this, arguments);
                };
            }
        </script>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
            }
            #map {
                min-height: 500px;
                height: 100%;
                width: 100%;
            }
            #debug {
                position: absolute;
                bottom: 10px;
                left: 10px;
                background: white;
                padding: 10px;
                border-radius: 4px;
                max-width: 500px;
                max-height: 250px;
                overflow: auto;
                z-index: 1000;
                font-size: 11px;
                font-family: monospace;
            }
            #actions {
                position: absolute;
                top: 10px;
                left: 10px;
                background: white;
                padding: 10px;
                border-radius: 4px;
                z-index: 1000;
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            button {
                padding: 5px 10px;
                cursor: pointer;
            }
            .success {
                color: green;
                font-weight: bold;
            }
            .error {
                color: red;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div id="map"></div>
        <div id="debug"></div>
        <div id="actions">
            <button id="testFetch">Test Direct Tile Fetch</button>
            <button id="useVectorTiles">Use Vector Tiles Style</button>
            <button id="useBasicStyle">Use Simple GeoJSON Style</button>
            <button id="clearDebug">Clear Log</button>
        </div>
        <script>
            // Debug function to log into the debug panel
            function logDebug(message, isError = false, isSuccess = false) {
                const debugEl = document.getElementById('debug');
                const timestamp = new Date().toISOString().substring(11, 19);
                let className = "";
                if (isError) className = "error";
                if (isSuccess) className = "success";
                
                debugEl.innerHTML += `[${timestamp}] <span class="${className}">${message}</span><br>`;
                debugEl.scrollTop = debugEl.scrollHeight;
            }

            setupRequestDebugging();
            
            const protocol = new pmtiles.Protocol();
            mapmetricsgl.addProtocol("pmtiles", protocol.tile);

            // Test URL for the specific tile format you provided
            const testTileUrl = "https://gateway.mapmetrics.org/20250110/1/1/1.mvt?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI4MjQ5NGNjNy04YTUzLTQwNGUtODNlOS1hZjA5OWY1MGE0Y2IiLCJzY29wZSI6WyJtYXBzIiwic2VhcmNoIl0sImlhdCI6MTc0NDY5NTgxOH0.3oDQzbcD72gIvtd4lkKi96aMFF3-d-i7UnIdc9iADeA";

            // Create style options for testing
            const vectorTileStyle = {
                "version": 8,
                "name": "Vector Tile Test",
                "sources": {
                    "custom-tiles": {
                        "type": "vector",
                        "tiles": [
                            "https://gateway.mapmetrics.org/20250110/{z}/{x}/{y}.mvt?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI4MjQ5NGNjNy04YTUzLTQwNGUtODNlOS1hZjA5OWY1MGE0Y2IiLCJzY29wZSI6WyJtYXBzIiwic2VhcmNoIl0sImlhdCI6MTc0NDY5NTgxOH0.3oDQzbcD72gIvtd4lkKi96aMFF3-d-i7UnIdc9iADeA"
                        ],
                        "maxzoom": 14
                    }
                },
                "layers": [
                    {
                        "id": "background",
                        "type": "background",
                        "paint": {
                            "background-color": "#f2f2f2"
                        }
                    },
                    {
                        "id": "custom-tiles-layer",
                        "type": "line",
                        "source": "custom-tiles",
                        "source-layer": "transportation",
                        "paint": {
                            "line-color": "#3887be",
                            "line-width": 2
                        }
                    },
                    {
                        "id": "custom-tiles-buildings",
                        "type": "fill",
                        "source": "custom-tiles",
                        "source-layer": "building",
                        "paint": {
                            "fill-color": "#aaa",
                            "fill-opacity": 0.6
                        }
                    }
                ]
            };

            // Simple style with GeoJSON
            const basicGeoJSONStyle = {
                "version": 8,
                "name": "Basic GeoJSON Style",
                "sources": {
                    "geojson-source": {
                        "type": "geojson",
                        "data": {
                            "type": "FeatureCollection",
                            "features": [
                                {
                                    "type": "Feature",
                                    "properties": {},
                                    "geometry": {
                                        "type": "Point",
                                        "coordinates": [2.3210938, 48.7965913]
                                    }
                                },
                                {
                                    "type": "Feature",
                                    "properties": {},
                                    "geometry": {
                                        "type": "LineString",
                                        "coordinates": [
                                            [2.3210938, 48.7965913],
                                            [3.3210938, 49.7965913],
                                            [4.3210938, 48.7965913]
                                        ]
                                    }
                                }
                            ]
                        }
                    }
                },
                "layers": [
                    {
                        "id": "background",
                        "type": "background",
                        "paint": {
                            "background-color": "#f2f2f2"
                        }
                    },
                    {
                        "id": "geojson-line",
                        "type": "line",
                        "source": "geojson-source",
                        "filter": ["==", "$type", "LineString"],
                        "paint": {
                            "line-color": "#33b5e5",
                            "line-width": 3
                        }
                    },
                    {
                        "id": "geojson-point",
                        "type": "circle",
                        "source": "geojson-source",
                        "filter": ["==", "$type", "Point"],
                        "paint": {
                            "circle-radius": 10,
                            "circle-color": "#e33b3b"
                        }
                    }
                ]
            };
            
            // Start with vector tile style by default
            let currentStyle = vectorTileStyle;
            
            const map = new mapmetricsgl.Map({
                container: "map",
                style: currentStyle,
                zoom: 2,
                center: [2.3210938, 48.7965913]
            }).addControl(new mapmetricsgl.NavigationControl(), "top-right");

            // Monitor events for debugging
            map.on('data', (e) => {
                if (e.dataType === 'source' && e.isSourceLoaded) {
                    logDebug(`Source loaded: ${e.sourceId}`, false, true);
                }
            });
            
            map.on('style.load', () => {
                logDebug('Map style loaded successfully!', false, true);
            });
            
            map.on('error', (e) => {
                console.error('Map error:', e.error);
                logDebug(`Error: ${e.error.message}`, true);
            });
            
            // Add button event handlers
            document.getElementById('testFetch').addEventListener('click', function() {
                logDebug('Testing direct tile fetch with credentials...');
                fetch(testTileUrl, {
                    credentials: 'include'
                })
                .then(response => { 
                    logDebug(`Manual fetch status: ${response.status}`, response.status >= 400, response.status < 400);
                    return response.blob(); 
                })
                .then(() => logDebug('Manual fetch completed successfully', false, true))
                .catch(err => logDebug(`Manual fetch failed: ${err.message}`, true));
            });
            
            document.getElementById('useVectorTiles').addEventListener('click', function() {
                logDebug('Switching to vector tile style...');
                map.setStyle(vectorTileStyle);
            });
            
            document.getElementById('useBasicStyle').addEventListener('click', function() {
                logDebug('Switching to basic GeoJSON style...');
                map.setStyle(basicGeoJSONStyle);
            });
            
            document.getElementById('clearDebug').addEventListener('click', function() {
                document.getElementById('debug').innerHTML = '';
            });

            // Log initial startup
            logDebug('Testing MapMetrics vector tiles with credentials. Please check Network tab in dev tools.', false, true);
        </script>
    </body>
</html>
