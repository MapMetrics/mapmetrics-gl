<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>MapMetrics Map - Flat Projection</title>
    <link href="dist/mapmetrics-gl.css" rel="stylesheet" />
    <script src="dist/mapmetrics-gl-dev.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        #map {
            min-height: 500px;
            height: 700px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: relative;
        }
    </style>
</head>
<body>
    <h2>Flat Map Test</h2>
    <div id="map"></div>

    <script>
        // Wait for the script to load
        window.onload = () => {

            const map = new mapmetricsgl.Map({
                container: "map",
                style:'https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/Images/PickSpot.json',//'https://api.protomaps.com/styles/v5/light/en.json?key=23a06ed261082457', // // be aware this token is not for production use
                center: [36.8219, -1.2921], // Center of Kenya (Nairobi) - MapMetrics GL uses [lng, lat]
                zoom: 7,
                fadeDuration: 0,
                cancelPendingTileRequestsWhileZooming: false,
                maxTileCacheZoomLevels: 10,
                crossSourceCollisions: false,
                attributionControl: true, // Hide attribution control          
attributionControl: {
                    customAttribution: 'My Custom App Name'
                }  
            }).addControl(new mapmetricsgl.NavigationControl(), "top-right");

            // Add car marker
            const carmarker = new mapmetricsgl.Marker({
                icon: "https://unpkg.com/@mapmetrics/mapmetrics-gl/dist/Images/car.png"
            })
                .setLngLat([36.8219, -1.2921])
                .addTo(map);

            // Add draggable marker
            const marker = new mapmetricsgl.Marker({
                color: "#FF0000",
                draggable: true
            })
                .setLngLat([36.9, -1.4])
                .addTo(map);

            // Add event listeners for map loading and errors
            map.on('load', () => {
                console.log('Flat map loaded');

                // Add a simple route line
                map.addSource('route', {
                    'type': 'geojson',
                    'data': {
                        'type': 'Feature',
                        'properties': {},
                        'geometry': {
                            'type': 'LineString',
                            'coordinates': [
                                [36.8219, -1.2921],
                                [36.85, -1.30],
                                [36.88, -1.32],
                                [36.90, -1.35]
                            ]
                        }
                    }
                });

                map.addLayer({
                    'id': 'route',
                    'type': 'line',
                    'source': 'route',
                    'layout': {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    'paint': {
                        'line-color': '#0080FF',
                        'line-width': 5
                    }
                });
            });

            map.on('error', (e) => console.error(`Map error: ${e.error?.message || 'Unknown error'}`));
        };
    </script>
</body>
</html>
