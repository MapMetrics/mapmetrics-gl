site_name: Mapmetrics GL JS
site_url: https://atlasdocs.mapmetrics.org/
repo_url: https://github.com/hmudasar992/mapmetrics-gl.git
site_description: >-
    Mapmetrics GL JS is a TypeScript library that uses WebGL to render
    interactive maps from vector tiles in a browser.
extra_css:
    - assets/extra.css
theme:
    name: "material"
    favicon: https://mapmetrics.org/wp-content/uploads/2022/04/cropped-Frame-5884-1-1.png
    logo: https://mapmetrics.org/wp-content/uploads/2022/04/Group-5900-1-1-1.png
    features:
        - content.code.copy
        - navigation.tabs
        - navigation.tabs.sticky
        - toc.follow
        - search.suggest
        - navigation.instant
        - navigation.sections
        - navigation.top # back to top button
    palette:
        - media: "(prefers-color-scheme)"
          toggle:
              icon: material/brightness-auto
              name: Switch to light mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          toggle:
              icon: material/brightness-4
              name: Switch to system preference
        - media: "(prefers-color-scheme: light)"
          scheme: default
          toggle:
              icon: material/brightness-7
              name: Switch to dark mode
markdown_extensions:
    - toc:
          toc_depth: 3
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - pymdownx.escapeall:
          hardbreak: True
          nbsp: True
    - attr_list

plugins:
    - search
    - social:
          cards_layout_options:
              background_color: "#295DAA"
validation:
    omitted_files: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
